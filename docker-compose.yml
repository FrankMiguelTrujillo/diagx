services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: diagx123
      POSTGRES_DB: diagx
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:diagx123@db:5432/diagx
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis